name: Feature request
description: Suggest something kflux should do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: Describe the behaviour. If it's a Fluxbox feature, name the Fluxbox setting or command.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do that you can't today.
    validations:
      required: true
